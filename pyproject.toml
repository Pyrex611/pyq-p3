[project]
name = "pyquant-control-center-api"
version = "1.0.0"
requires-python = ">=3.12"
# Deliberately NOT the project's root requirements.txt dependency set (the
# full Alpaca/Binance/Bybit/UKF/Optuna trading stack) — this is the whole
# dependency list the VERCEL FUNCTION needs, nothing more. api/index.py
# only ever imports pyquant_state.py, never pyq_p4.py/p4_utils.py/
# walkforward.py/p4_orchestra.py (the processes that actually hold
# exchange credentials and run the trading engine — those run elsewhere,
# see VERCEL_DEPLOY.md and VPS_SETUP.md).
dependencies = [
    "fastapi>=0.110.0",
    # Only exercised when DATABASE_URL is set (pyquant_state.py's Postgres
    # backend) — listed unconditionally so it's already installed whenever
    # DATABASE_URL does get set in the Vercel project's environment variables.
    "psycopg2-binary>=2.9.9",
    # Kaggle backtest integration (KAGGLE.md) — POST /api/backtests uses
    # this package's Python API (KaggleApi().kernels_push(...)) to trigger
    # a kernel run. Found missing here 2026-10-19: it was added to
    # api/requirements.txt instead, which this deployment's framework
    # preset does NOT read (see this file's own header comment, and
    # VERCEL_DEPLOY.md) — the exact same class of mistake that caused the
    # original 404 this project already debugged once. The symptom was a
    # 502 on every backtest attempt with "No outgoing requests" in the
    # Vercel log: `from kaggle.api.kaggle_api_extended import KaggleApi`
    # was raising ModuleNotFoundError before any Kaggle API call was ever
    # attempted, caught by create_backtest()'s except block. Pure Python,
    # no native deps, cheap to include even though only exercised when
    # KAGGLE_USERNAME/KAGGLE_KEY are set.
    "kaggle>=1.6.0",
]

# This is what makes Vercel's Python framework preset find the app: without
# it, Vercel only looks for an entrypoint named app.py/index.py/server.py/
# main.py/wsgi.py/asgi.py at the PROJECT ROOT or under src/ or app/ — never
# under api/. Pointing it here explicitly lets the app stay at api/index.py
# (consistent with this repo's existing layout) while still using the
# current, officially-recommended framework-preset deployment model, under
# which Vercel routes EVERY request to this one app (api/index.py's own
# docstring + its StaticFiles mount is what serves the frontend from the
# same app for exactly this reason).
[tool.vercel]
entrypoint = "api.index:app"

name: PyQuant Backtest (triggered by UI)

# 2026-10-25: alternative execution path for the Backtest screen's "Run"
# button, alongside (not yet replacing) the Kaggle-kernel path in
# kaggle_backtest/. Added after the Kaggle kernel-type 409 Conflict was
# fixed but a SUBSEQUENT run still failed with Kaggle's UI showing no
# error log at all — Kaggle's own kernel-execution environment has
# turned out to be opaque to debug from here (no way to inspect its logs
# programmatically from this session). This workflow reuses the exact
# same requirements.txt this repo's own orchestra.yml already installs
# successfully on every single cron tick (proven reliable, unlike the
# Kaggle kernel sandbox) and GitHub Actions' own already-proven-reliable
# log viewer. See KAGGLE.md's "GitHub Actions alternative" section and
# PLAN.md's 2026-10-25 entry for the full writeup of why this path was
# built, and PLAN.md's 2026-10-29 entry for why it became the primary
# path (confirmed working live) with Kaggle demoted to a backup.
#
# 2026-10-29: historical data now comes straight from Alpaca via
# data_download.py — the SAME script `p4_orchestra.py`'s
# `daily_optimizer()` already calls once a day for the live engine —
# instead of a Kaggle Dataset snapshot that only updates when someone
# manually re-uploads it (KAGGLE.md Part H's "No automatic dataset
# refresh" limitation). This is now the primary backtest path, so
# running it against however-stale a hand-maintained dataset happens to
# be defeated the point of a "re-run this to check current behavior"
# button. `ALPACA_API_KEY`/`ALPACA_SECRET_KEY` were already GitHub repo
# secrets (orchestra.yml's own cron tick uses them) and `alpaca-py`/
# `python-dotenv` were already in requirements.txt — no new secrets, no
# new dependencies, just a different source for the same two CSV files.
# The Kaggle Dataset is no longer read by this workflow at all; it's
# still what the Kaggle-kernel BACKUP path (kaggle_backtest/run_backtest.py)
# reads, since that script runs inside Kaggle's own sandbox with no
# Alpaca credentials attached to it.
#
# Triggered the same way as a manual test run (Actions tab -> this
# workflow -> "Run workflow"), or programmatically by api/index.py's
# POST /api/backtests via GitHub's REST dispatch API (same mechanism,
# same repo-scoped PAT, as GITHUB_ACTIONS_SETUP.md Part G's cron pinger).

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "pyquant_runs row id this run reports back into"
        required: true
        type: string
      walk_forward_days:
        description: "Override walkforward.WALK_FORWARD_DAYS (blank = use the file's default). Ignored if start_date/end_date are set."
        required: false
        type: string
        default: ""
      start_date:
        description: "2026-10-31: explicit test-window start date (YYYY-MM-DD, blank = use walk_forward_days)"
        required: false
        type: string
        default: ""
      end_date:
        description: "2026-10-31: explicit test-window end date (YYYY-MM-DD, blank = latest available bar)"
        required: false
        type: string
        default: ""
      bayesian_trials:
        description: "Override walkforward.BAYESIAN_TRIALS (blank = use the file's default)"
        required: false
        type: string
        default: ""
      leverage:
        description: "Override walkforward.LEVERAGE (blank = use the file's default)"
        required: false
        type: string
        default: ""
      use_bayesian:
        description: "Override walkforward.USE_BAYESIAN"
        required: false
        type: boolean
        default: true
      use_atr_sl:
        description: "Override walkforward.USE_ATR_SL"
        required: false
        type: boolean
        default: true

concurrency:
  # One backtest at a time, matching the Kaggle path's own documented
  # limitation (KAGGLE.md) — a second dispatch while one is running
  # queues behind it rather than running concurrently against the same
  # pyquant_runs row semantics.
  group: pyquant-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download fresh historical data from Alpaca
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        # Same data_download() call daily_optimizer() already makes for
        # the live engine — writes btc_back366.csv/eth_back366.csv (and
        # the _365 variants walkforward.py doesn't read but no harm in
        # having) freshly from Alpaca every time this job runs, instead
        # of a Kaggle Dataset snapshot someone has to remember to update.
        run: python3 data_download.py

      - name: Run backtest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RUN_ID: ${{ inputs.run_id }}
          WALK_FORWARD_DAYS: ${{ inputs.walk_forward_days }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          BAYESIAN_TRIALS: ${{ inputs.bayesian_trials }}
          LEVERAGE: ${{ inputs.leverage }}
          USE_BAYESIAN: ${{ inputs.use_bayesian }}
          USE_ATR_SL: ${{ inputs.use_atr_sl }}
        run: python3 kaggle_backtest/run_backtest_gha.py
